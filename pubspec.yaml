name: scanme
description: Offline CamScanner-style document scanner.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  google_mlkit_document_scanner: ^0.5.0
  image: ^4.9.1
  pdf: ^3.13.0
  path_provider: ^2.1.6
  path: ^1.9.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  photo_view: ^0.15.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: LiberationSans
      fonts:
        - asset: fonts/LiberationSans-Regular.ttf
        - asset: fonts/LiberationSans-Bold.ttf
          weight: 700
    - family: LiberationSerif
      fonts:
        - asset: fonts/LiberationSerif-Regular.ttf
        - asset: fonts/LiberationSerif-Bold.ttf
          weight: 700
  assets:
    - assets/branding/apptriangle_logo.png
