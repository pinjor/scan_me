name: scanme
description: Offline CamScanner-style document scanner by Apptriangle.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  google_mlkit_document_scanner: ^0.5.0
  image: ^4.9.1
  pdf: ^3.13.0
  path_provider: ^2.1.6
  path: ^1.9.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  photo_view: ^0.15.0
  intl: ^0.20.3
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#010C20"
  adaptive_icon_foreground: assets/branding/app_icon.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: fonts/PlusJakartaSans.ttf
  assets:
    - assets/branding/apptriangle_logo.png
    - assets/branding/app_icon.png
